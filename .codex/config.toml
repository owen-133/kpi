# 프로젝트 하네스 설정 — 일반 대화와 구현은 범용 모델, 복잡한 설계와 일감 분할은 최상위 모델이 맡는다.
#
# 모델 매핑은 판단이다. 측정한 값이 아니다.
# 역할 분담의 원형은 Claude 모델(범용 / 최상위 / 범용)이고 Codex 에서는 돌지 않는다.
# 그래서 범용 역할은 gpt-6.1-sol, 최상위 역할은 gpt-6-astra 로 대신한다.
# 모델 슬러그는 ~/.codex/models_cache.json 에 있는 값만 쓴다.
#
# 이 파일은 프로젝트를 신뢰한 경우에만 읽힌다. 프로필 파일은 쓰지 않는다.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
# 사용자가 직접 부를 때만 서브에이전트가 뜬다. 이 값은 모델을 따로 정하지 않은 서브에이전트의 기본이다.
default_subagent_model = "gpt-6.1-sol"
# 동시 스레드는 3 으로 둔다. 일감이 파일 범위로 갈리므로 병렬 이득이 3 쯤에서 꺾이고,
# 그 이상은 합칠 때 충돌 확인과 검토 비용이 더 크다.
max_concurrent_threads_per_session = 3
